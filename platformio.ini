; --- CONFIGURACIÓN COMÚN (Para no repetir) ---
[common]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 921600
monitor_dtr = 0
monitor_rts = 0
build_type = debug
; mcp_can NO va aqui: se usa la copia parcheada en lib/mcp_can/ (fix de
; desbordamiento de m_nDta con DLC > 8, ver lib/mcp_can/mcp_can.cpp). Si se
; vuelve a añadir la dependencia del registro, PlatformIO puede coger esa
; version sin el fix en vez de la local.
lib_deps =
    jgromes/RadioLib @ ^6.6.0
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays @ ^4.6.2

    

; --- ENTORNO 1: EL COCHE (TRANSMISOR) ---
[env:base_rx]
extends = common
build_src_filter =
    +<base_rx/*>


; --- ENTORNO 2: LA BASE (RECEPTOR) ---
[env:coche_tx]
extends = common
build_src_filter =
    +<coche_tx/*>


; --- ENTORNO 3: LAPTIMER (TRANSMISOR POR GPIO) ---
[env:laptimer_tx]
extends = common
build_src_filter =
    +<laptimer_tx/*>