; --- CONFIGURACIÓN COMÚN (Para no repetir) ---
[env]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 921600
monitor_dtr = 0
monitor_rts = 0
lib_deps =
    jgromes/RadioLib @ ^6.6.0
    coryjfowler/mcp_can @ ^1.5.0
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays @ ^4.6.2

; --- ENTORNO 1: EL COCHE (TRANSMISOR) ---
[env:coche_tx]
build_src_filter = +<*> -<RX.cpp>

; --- ENTORNO 2: LA BASE (RECEPTOR) ---
[env:base_rx]
build_src_filter = +<*> -<TX.cpp>

